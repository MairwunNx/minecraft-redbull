name: Release

# Run by hand: Actions → Release → Run workflow, with the new version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 2.0.0"
        required: true
      changelog:
        description: "Changelog in Markdown; leave empty to take the version's section from CHANGELOG.md"
        required: false
      modrinth:
        description: "Also publish to Modrinth (needs the MODRINTH_TOKEN secret)"
        type: boolean
        default: false
      hangar:
        description: "Also publish to Hangar (needs the HANGAR_TOKEN secret)"
        type: boolean
        default: false
      moonlands:
        description: "Ship the release to Moonlands (needs the FAMILY_ACTIONS_TOKEN secret)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      CHANGELOG: ${{ inputs.changelog }}
      # Outside the repo files, but in the workspace, where Gradle finds it by a relative path.
      NOTES: release-notes.md
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$VERSION isn't a version like 2.0.0"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released"; exit 1
          fi
      - name: Write the release notes
        shell: python
        run: |
          import os, re, sys
          version, typed = os.environ["VERSION"], os.environ["CHANGELOG"].strip()
          if typed:
              notes = typed
          else:
              text = open("CHANGELOG.md", encoding="utf-8").read()
              match = re.search(rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
              notes = match.group(1).strip() if match else ""
          if not notes:
              sys.exit(f"::error::No changelog: add a “## {version}” section to CHANGELOG.md or fill the changelog field")
          open(os.environ["NOTES"], "w", encoding="utf-8").write(notes + "\n")
          print(notes)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build -PreleaseVersion="$VERSION"
      - name: Publish the GitHub release
        # Every jar twice: with its version, and without, so releases/latest/download/redbull-paper.jar,
        # redbull-neoforge.jar, and redbull-fabric.jar always fetch the newest; redbull.jar too, the Paper jar's
        # name up to 1.1.1, so links to it keep working. The pack under the name the plugin
        # builds its default URL from.
        run: |
          cp "paper/build/libs/redbull-paper-$VERSION.jar" paper/build/libs/redbull-paper.jar
          cp "paper/build/libs/redbull-paper-$VERSION.jar" paper/build/libs/redbull.jar
          cp "neoforge/build/libs/redbull-neoforge-$VERSION.jar" neoforge/build/libs/redbull-neoforge.jar
          cp "fabric/build/libs/redbull-fabric-$VERSION.jar" fabric/build/libs/redbull-fabric.jar
          cp paper/build/pack/redbull-pack.zip "paper/build/pack/redbull-pack-$VERSION.zip"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Red Bull $VERSION" --notes-file "$NOTES" \
            "paper/build/libs/redbull-paper-$VERSION.jar" paper/build/libs/redbull-paper.jar paper/build/libs/redbull.jar \
            "paper/build/pack/redbull-pack-$VERSION.zip" \
            "neoforge/build/libs/redbull-neoforge-$VERSION.jar" neoforge/build/libs/redbull-neoforge.jar \
            "fabric/build/libs/redbull-fabric-$VERSION.jar" fabric/build/libs/redbull-fabric.jar
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to Modrinth
        if: inputs.modrinth
        # Paper's jar through Minotaur, which reads the project while it runs, so not with the configuration cache;
        # the mods through Modrinth's v3 API, which takes the client-and-server environment Minotaur can't set.
        run: |
          ./gradlew :paper:modrinth -PreleaseVersion="$VERSION" -PchangelogFile="$NOTES" --no-configuration-cache
          python3 -I scripts/modrinth_mods.py --version "$VERSION" --notes "$NOTES"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      - name: Publish to Hangar
        if: inputs.hangar
        # The version, then the project page from MODRINTH.md, which Hangar doesn't sync by itself.
        run: ./gradlew publishPluginPublicationToHangar syncAllPluginPublicationPagesToHangar -PreleaseVersion="$VERSION" -PchangelogFile="$NOTES" --no-configuration-cache
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}

  deploy:
    needs: release
    if: inputs.moonlands
    runs-on: ubuntu-latest
    steps:
      - name: Ship to Moonlands
        # Moonlands' “Ship a release” workflow puts the new jar on the server, unless it's built for another game version.
        run: gh workflow run ship-plugin.yml -R MairwunNx/minecraft -f repo="$GITHUB_REPOSITORY" -f version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.FAMILY_ACTIONS_TOKEN }}
          VERSION: ${{ inputs.version }}
