name: Autopilot

# Every Monday Claude updates this project, moves it to a new Minecraft version once its platform
# is ready, and releases what changed. “Autopilot” in Moonlands' CLAUDE.md explains the family's runs.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-opus-5-5
            --permission-mode bypassPermissions
          prompt: |
            You are this project's autopilot. You run unattended in GitHub Actions with the owner's standing go-ahead; nobody will answer questions, so decide as CLAUDE.md and the skills say.

            1. Run /update-deps.
            2. Run /update-minecraft.
            3. If either pushed a change that reaches what the project ships, release it. The version is the topmost “## X.Y.Z” section of CHANGELOG.md. Run `gh workflow run release.yml -f version=X.Y.Z` with the store switches “Stores” in CLAUDE.md allows, watch it with `gh run watch`, and check every place it publishes to, as CLAUDE.md says. Its `deploy` job then ships the release to Moonlands by itself.

            If nothing was behind, stop without a commit or a release. Never print a secret. End with the reports the skills describe.
